<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="grid1.css">
    <title>Document</title>
    <Style>
        .container{
            display: grid;
            gap:3%;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            grid-template-areas:
            "box1 box1 box3"
            "box1 box1 box2"
            "box6 box4 box5"
            "box6 box4 box7"
            "box8 box9 box7";
            grid-template-rows:auto; 
        }
        .box{
            border: 2px solid black;
            background-color: aliceblue;
            min-height: 100px;
            min-width: 100px;
        }
    </Style>
</head>

<body>
    <div class="container">
        <div class="box" style="grid-area: box1">1</div>
        <div class="box" style="grid-area: box2">2</div>
        <div class="box" style="grid-area: box3">3</div>
        <div class="box" style="grid-area: box4">4</div>
        <div class="box" style="grid-area: box5">5</div>
        <div class="box" style="grid-area: box6">6</div>
        <div class="box" style="grid-area: box7">7</div>
        <div class="box" style="grid-area: box8">8</div>
        <div class="box" style="grid-area: box9">9</div>
    </div>
</body>
</html>
