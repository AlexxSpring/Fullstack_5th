<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            outline: 1px solid black;
            height: 500px;
            width: 500px;

        }
        
        .container>div{
            outline: 1px dashed grey;
            text-align: center;
            align-content: center;
        }

        #box1{
            /* grid-column-start: 1;
            grid-column-end: 3; */
            /* grid-row-start: 1; */
            /* grid-row-end: 3; */

            /* The above two lines can be replaced with the following line of code: */
            
            grid-column: 1/3;
            grid-row: 1/3;
            
            /* end */

            background-color: pink;
            z-index: 1;
        }

        #box6{
            grid-column: 2/3;
            grid-row: 1/2; 
            background-color: lightblue;

            z-index: 2;
        }

    



    </style>

</head>
<body>

    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
    
</body>
</html>
