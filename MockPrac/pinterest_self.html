<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            box-sizing: border-box;
        }

        body{
            margin:0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* Navbar */

        nav {
            position: sticky;
            top:0;

            background: white;
            padding: 15px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo{
            font-size: 22px;
            font-weight: bold;
            color: red;
        }

        .search{
            width: 40%;
            padding: 10px;
            border-radius: 10px;
            background: #eee;
            border: none;
        }


        /* gallery */

        .gallery{
            display: grid;
            grid-template-columns: repeat( )
        }


    </style>

</head>
<body>

    <!--Navigation Bar-->

    <nav>
        <div class="logo"> Pinterest </div>
        <input type="text" class="search" placeholder="search for ideas">
        <div class="icons"> :)) </div>
    </nav>


    <!-- Gallery  -->

    <div class="gallery">

        <div class="card tall">

        </div>
        <div class="card tall">
