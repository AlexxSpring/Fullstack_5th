<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .bento{
            display:grid;
            height: 90vh;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            grid-template-rows: auto;
            grid-template-areas:
            "box1 box1 box2"
            "box3 box4 box2"
            "box3 box5 box5";

            gap: 15px;
        }

        .box{
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        
    </style>

</head>
<body>
    
    <div class="bento">
        <div class="box 1" style="grid-area: box1">a</div>
        <div class="box 2" style="grid-area: box2">b</div>
        <div class="box 3" style="grid-area: box3">c</div>
        <div class="box 4" style="grid-area: box4">d</div>
        <div class="box 5" style="grid-area: box5">e</div>
        
    </div>

</body>
</html>
