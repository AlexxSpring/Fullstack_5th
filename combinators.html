<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h2+p{
            color:blue
        }
        h2~p{
            text-transform: uppercase;
        }

        section h2{
            color: magenta;
            text-shadow: 1px 1px 0 black;
        }

        section>h2{
            text-transform: lowercase;
        }

        #mypara{
            color: blueviolet;
        }

        .para{
            color:blue;
        }

        p{
            color: red!important;
        }

        button:hover{
            background-color:black;
            color: white;
        }
        button:active{
            background-color:green;
            color:blue;
        }
    </style>
</head>
<body>

    <section>
        <h2>Heading 1</h2>
        <p>Para1</p>
        <p>Para2</p>
        <div>
            <h2>Heading 2</h2>
        </div>
    </section>

    <p>Para3</p>
    <p class="para" id="mypara" style="color: grey!important">HelloWorld</p>

    <button>
        Click Me!
    </button>
    
</body>
</html>
