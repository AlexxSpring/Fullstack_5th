<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing: border-box;
    }

    body{
        margin:0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
    }

    .clock{
        width:370px;
        height:370px;
        border-radius:50%;

        background: conic-gradient(
            from 5deg,
            blue 0deg 240deg,
            black 240deg 355deg,
            blue 355deg 260deg
        );

        position: relative;
        display:flex;
        justify-content: center;
        align-items: center;
    }

    /* Makes the ring hollow */
    .clock::before{
            content:"";
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius:50%;
            background: #111;
        }

    .time{
        position: relative;
        color: blue;
        font-family: monospace;
        font-size: 52px;
        letter-spacing: 2px;
    }

</style>

<body>
    <div class="clock">
        <div class="time">10 PM</div>
    </div>
</body>
</html>
