<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{

        }
    </style>

</head>

<body>

    <div class="container">

        <h1>QUIZ ARENA APP</h1>

        <!-- SCREEN 1 : Quiz -->
        <section id="quiz-screen">
            <div id="status-bar">
                <span id="progress">1/10</span>
                <span id="timer">30:00 secs</span>
                <span id="score">Score : 0</span>
            </div>

            <h2 id="question">Questions will appear here</h2>

            <div id="options">
                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="btn">4</button>
            </div>

            <div id="explanation">Explanantion goes here</div>

            <div class="actions">
                <button id="next-btn">NEXT</button>
                <button id="restart-btn"> RESTART</button>
            </div> 
        </section>


        <!-- SCREEN 2 : Result -->
        <section>
            <h2>Quiz Complete!</h2>
            <p id="final-score">7 / 10</p>
            <p id="rating">Rating message goes here</p>
            <div class="actions">
                <button id="review-btn">Review wrong answers</button>
                <button class="restart-btn">Play again</button>
            </div>
        </section>


        <!-- SCREEN 3 : Review -->
        <section>
            <h2>Review</h2>
            <div id="review-list">
                <p>Wrong answers will be listed here.</p>
            </div>
            <div class="actions">
                <button id="back-btn">Back to results</button>
                <button class="restart-btn">Play again</button>
            </div>
        </section>


    </div>



    


</body>


<script src="jsquiz.js"></script>
</html>
