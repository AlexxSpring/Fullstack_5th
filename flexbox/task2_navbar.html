<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin:0px;
            padding: 0px;
        }

        .container{
            display: flex;
            flex-wrap: nowrap;
            height:97vh;
            /* background-color:  */
        }

        .navbar{
            display:flex;
            flex-wrap: nowrap;
            margin-top: 3px;
            height:40px;
            background-color: black;
            color: whitesmoke;
            width:100%;
            border: 2px solid black;
            border-radius:10px;
            justify-content: space-between
        }

        #box1{
            margin: auto;
            margin-left: 15px;
        }

        #box2{
            margin: auto;
            margin-right: 15px;
        }

        ul{
            list-style: none;
            gap: 20px;
        }

        li{
            display: inline-block;
            padding:0 20px;
        }

        a{
            text-decoration: none;
        }

        button{
            color:whitesmoke;
            background-color:#007bff;
            border-radius: 3px;
        }
    </style>

</head>
<body>

    <div class="container">
        <div class="navbar">
            <div class="box" id="box1">
                <p>NAVBAR</p>
            </div>
            <div class="box" id="box2">
                <ul>
                    <li >
                        <a href="#">HOME</a>
                    </li>
                    <li>
                        <a href="#">CONTACT</a>
                    </li>
                    <li>
                        <a href="#">ABOUT</a>
                    </li>

                    <li><button type="submit">LOGIN</button></li>
                    <li><button type="submit">SIGNUP</button></li>
                </ul>
            </div>
        </div>
        
    </div>
    
</body>
</html>
