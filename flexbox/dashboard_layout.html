<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            display:flex;
            flex-wrap: nowrap;
            flex-direction: row;
            outline: 2px solid black;
            height: 100vh;
            width: 97vw;
            background-color: beige;
            justify-content: space-between;
        }

        .container2{
            background-color: lightblue;
            display: flex;
            flex-direction:column;
            outline: 2px solid black;
            margin: 10px 10px 10px 10px;
            width: 20%;
        }

        .nav{
            border: 1px solid black;
            justify-content: center;
            align-items: center;
            height: 100%;
        }


        nav ul{
            list-style: none;
            padding: 10px;
        }
        li{
            list-style: none;
        }



        .container3{
            background-color: lightblue;
            display: flex;
            flex-direction:column;
            outline: 2px solid black;
            margin: 10px 10px 10px 10px;
            width: 80%;
        }

        .products{
            display: flex;
            flex-wrap: none;
            justify-content: space-around;
            text-align: center;
            align-items: center;
            border: 1px solid black;
            padding: 10px;
            margin: 10px;

        }

        .box{
            height: 100px;
            width: 100px;
            border: 1px solid black;
        }

        .header{
            text-align: left;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 10px 10px 10px;
            border: 1px solid black;
        }

        #box1, #box2, #box3, #box4{
            text-align: center;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 10px 10px 10px;
            border: 1px solid black;
            background-color: beige;
        }

        #box5, #box6, #box7, #box8{
            text-align: center;
            padding: 10px;
            font-size: 10px;
            font-weight: bold;
            margin: 10px 10px 10px 10px;
            border: 1px solid black;
            background-color: beige;
        }

        .list{
            border: 1px solid black;
            padding: 10px;
            margin: 10px;

        }

        .item{


        }

        p{
            font-size: 20px;
            font-weight:100

        }


        
    


    </style>

</head>
<body>

    <div class="container">
        <div class="container2">
            <div class="nav">
                <h2>DASHBOARD</h2>
                <ul>
                    <li>Dashboard</li>
                    <li>Users</li>
                    <li>Products</li>
                    <li>Orders</li>
                    <li>Settings</li>
                </ul>
            </div>
        </div>

        <div class="container3">
            <div class="header">DASHBOARD Overview</div>

            <div class="products">
                <div class="box" id="box1">1</div>
                <div class="box" id="box2">2</div>
                <div class="box" id="box3">3</div>
                <div class="box" id="box4">4</div>
            </div>

            <div class="list">\

                <p>Recent Orders :</p>

                <div class="item" id="box5">List Item 1</div>
                <div class="item" id="box6">List Item 2</div>
                <div class="item" id="box7">List Item 3</div>
                <div class="item" id="box8">List Item 4</div>
            </div>
        </div>
           

    </div>
    
</body>
</html>
