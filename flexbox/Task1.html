<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <title>Document</title>

    <style>

        .container{
            height:100vh;
            width:100wh;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        #box1{
            /* justify-content: center;
            align-items: center; */
            text-align: center;
            margin: 1%;
            width: 300px;
            height: 200px;
            background-color: pink;
            border: 3px solid black;
            border-radius: 10px;
            box-shadow: 3px 3px 3px black;
        }

        .fields{
            margin: auto;
        }

        input{
            margin: auto;
        }

        #login input{
            display:block;
            margin: auto;
            margin-top: 5%;
            box-shadow: 3px 3px 0 black;
            font-size: 20px;
        }

        input[type="submit"]{
            margin-top: 7%;
            background-color: black;
            color: white;
        }

        h2{
            text-transform:uppercase;
            text-shadow: 0 0 2px purple;
        }


    </style>
</head>
<body>

    <div class="container">
        <div id="box1">
            <form action="">

                <h2>Login</h2>
                
                <label for="username" id="username" class="fields">Username : </label>
                
                <input type="text" placeholder="Enter Username" required>
                <br>
                <br>
                <label for="password" id="password" class="fields">Password : </label>
                <input type="password" placeholder="Enter Password" required>
                <br>
                <br>
                <button type="submit" id="login">LOGIN</button>
            </form>
        </div>

    </div>
</body>
</html>
