<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <title>Document</title>

    <style>
        .container{
            height:100vh;
            display: flex;
            flex-wrap: wrap;
            /* margin: auto; */
            justify-content: center;
            align-items: center;
        }

        #box1{
            /* justify-content: center;
            align-items: center; */
            text-align: center;
            margin: 10px 20px;
            width: 300px;
            height: 200px;
            background-color: beige;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 3px 0 3px black;
        }

        .fields{
            margin: auto;
        }

        input{
            margin: auto;
        }

        h2{
            text-transform:uppercase;
            text-shadow: 0 0 2px purple;
        }


    </style>
</head>
<body>

    <div class="container">
        <div id="box1">

            <h2>Login</h2>
            
            <label for="username" id="username" class="fields">Username : </label>
            
            <input type="text" placeholder="Enter Username" required>
            <br>
            <br>
            <label for="password" id="password" class="fields">Password : </label>
            <input type="password" placeholder="Enter Password" required>
            <br>
            <br>
            <button type="submit">LOGIN</button>
        </div>

    </div>
</body>
</html>
