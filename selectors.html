<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            color:blue;
        }

        #myID{
            color: green;
        }

        .myClass{
            color:red;
        }

        input[type="email"]{
            border: 2px solid black;
            border-radius: 10px;
            color: purple;
        }

        input[type="password"]{
            border: 2px solid black;
            border-radius: 10px;
            color: purple;
        }

    </style>
</head>
<body>
    <h2>Selectors</h2>
    <ul>
        <li class="myClass">Universal</li>
        <li id="myID">ID</li>
        <li class="myClass">Class</li>
        <li>Attribute</li>
        <li>Element Name</li>
        <li>Combinators</li>
        <li>Pseudo Class</li>
        <li>Pseudo Elements</li>
        <li></li>
    </ul>

    <input type="email" placeholder="Email">
    <br>
    <input type="password" placeholder="password">
</body>
</html>
